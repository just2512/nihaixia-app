name: Flutter Quality Gate

on:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-quality.yml"
  pull_request:
    branches: [master]
    paths:
      - "lib/**"
      - "test/**"
      - "integration_test/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - ".github/workflows/flutter-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Run Dart test suite
        run: flutter test --no-pub --reporter expanded

      - name: Run Android native unit tests
        run: |
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon
