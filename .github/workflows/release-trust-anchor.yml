name: Release trust-anchor gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-trust-anchor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-keyring:
    name: Production Key Ring readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YANJI_LICENSE_KEY_RING: ${{ secrets.YANJI_LICENSE_KEY_RING }}
    steps:
      - name: Checkout full source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Release trust scanner tests
        run: python -m unittest tool.license_issuer.test_release_readiness -v

      - name: Verify production trust anchors and exclude test key material
        run: python tool/license_issuer/check_release_readiness.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      # This ephemeral key only signs a CI inspection APK; it is never
      # distributed and is not the product's release signing identity.
      - name: Create ephemeral CI-only APK signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/release-scan.p12" \
            -storepass "ci-only-password" \
            -keypass "ci-only-password" \
            -alias "release-scan" \
            -dname "CN=Yanji CI Release Scan" \
            -keyalg RSA -keysize 2048 -validity 2
          cat > android/key.properties <<EOF
          storeFile=${RUNNER_TEMP}/release-scan.p12
          storePassword=ci-only-password
          keyAlias=release-scan
          keyPassword=ci-only-password
          storeType=PKCS12
          EOF

      - name: Build arm64 Release APK for artifact inspection
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-shrink \
            --target-platform android-arm64 \
            --dart-define="YANJI_LICENSE_KEY_RING=${YANJI_LICENSE_KEY_RING}"

      - name: Scan built Release APK for test issuer key material
        run: >-
          python tool/license_issuer/check_release_readiness.py
          --scan-path build/app/outputs/flutter-apk/app-release.apk

      - name: Verify Release composition against configured Key Ring
        shell: bash
        run: |
          set -euo pipefail
          flutter test \
            --dart-define="YANJI_LICENSE_KEY_RING=${YANJI_LICENSE_KEY_RING}" \
            test/release_license_key_ring_test.dart

