name: Flutter tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # v2 avoids an orphaned in-progress Actions run from the previous concurrency group.
  group: flutter-tests-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        id: dependencies
        run: flutter pub get

      - name: Run local AI contract tests
        if: steps.dependencies.outcome == 'success'
        run: flutter test --no-pub test/local_ai_service_test.dart

      - name: Run full regression suite
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter test --no-pub

      - name: Build Android debug APK
        id: apk
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter build apk --debug --no-pub

      - name: Upload resolved dependency lockfile
        if: always() && steps.dependencies.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android debug APK
        if: always() && steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
