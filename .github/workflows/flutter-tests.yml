name: Flutter tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        id: dependencies
        run: flutter pub get

      - name: Run local AI contract tests
        if: steps.dependencies.outcome == 'success'
        run: flutter test --no-pub test/local_ai_service_test.dart

      - name: Run full regression suite
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter test --no-pub

      - name: Build Android debug APK
        if: always() && steps.dependencies.outcome == 'success'
        run: flutter build apk --debug --no-pub
