name: Flutter tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-tests-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Dart and Flutter static analysis
        if: steps.dependencies.outcome == 'success'
        run: flutter analyze --no-pub

      - name: Run local AI contract tests
        if: steps.dependencies.outcome == 'success'
        run: flutter test --no-pub test/local_ai_service_test.dart

      - name: Run full regression suite
        id: regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub

      - name: Upload Flutter test failure diffs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-failure-diffs
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 3

  build-apk:
    name: Android debug APK
    needs: test
    # Preserve the build signal even when the regression job fails.
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Run Android local unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
