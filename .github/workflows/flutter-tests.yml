name: Flutter tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-tests-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        id: dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Dart and Flutter static analysis
        if: steps.dependencies.outcome == 'success'
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run local AI contract tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_service_test.dart

      - name: Run recorder retry widget regression
        id: recorder_retry
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "re-enables stop after a recorder stop failure and accepts a successful retry"

      - name: Run native status-unknown widget regression
        id: model_status_unknown
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.recorder_retry.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "disables local AI actions when native status cannot be verified"

      - name: Run post-send native status readback regression
        id: post_send_status
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.model_status_unknown.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "post-send native status readback"
      - name: Run post-send native model teardown regression
        id: post_send_teardown
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.post_send_status.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "post-send native model teardown"

      - name: Run local AI photo picker lifecycle regression
        id: photo_picker
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.post_send_teardown.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "local AI photo picker lifecycle"

      - name: Run local AI model control serialization regression
        id: model_control
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.photo_picker.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "local AI model control serialization"

      - name: Run local AI model setup serialization regression
        id: model_setup
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.model_control.outcome == 'success' }}
        run: flutter test --no-pub test/local_ai_interview_screen_test.dart --plain-name "local AI model setup serialization"

      - name: Run full regression suite
        id: regression
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.recorder_retry.outcome == 'success' && steps.model_status_unknown.outcome == 'success' && steps.post_send_status.outcome == 'success' && steps.post_send_teardown.outcome == 'success' && steps.photo_picker.outcome == 'success' && steps.model_control.outcome == 'success' && steps.model_setup.outcome == 'success' }}
        run: flutter test --no-pub

      - name: Upload Flutter test failure diffs
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.regression.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-failure-diffs
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 3

  build-apk:
    name: Android debug APK
    needs: test
    # Preserve the build signal even when the regression job fails.
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Find N2 target is arm64-v8a. Avoid building unused ABI APKs on
      # the hosted runner, while leaving local/release Gradle defaults intact.
      ORG_GRADLE_PROJECT_ciArm64Only: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Report available disk space
        run: |
          df -h /
          df -h "$GITHUB_WORKSPACE"

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub --target-platform android-arm64 -P disable-abi-filtering=true

      - name: Run Android local unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest

      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v7
        with:
          name: resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
